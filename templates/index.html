<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainfall Prediction System</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="card">
        <h2>🌧️ Rainfall Prediction</h2>
        <p class="subtitle">Enter atmospheric parameters to predict tomorrow's rainfall</p>
        
        <form action="/predict-ui" method="post">
            <div class="input-group">
                <label for="Temp3pm">Temperature at 3 PM (°C)</label>
                <input type="number" step="any" id="Temp3pm" name="Temp3pm" placeholder="e.g. 28.5" required>
            </div>

            <div class="input-group">
                <label for="Humidity3pm">Humidity at 3 PM (%)</label>
                <input type="number" step="any" id="Humidity3pm" name="Humidity3pm" placeholder="e.g. 75" required>
            </div>

            <div class="input-group">
                <label for="WindSpeed3pm">Wind Speed at 3 PM (km/h)</label>
                <input type="number" step="any" id="WindSpeed3pm" name="WindSpeed3pm" placeholder="e.g. 35" required>
            </div>

            <div class="input-group">
                <label for="Pressure3pm">Pressure at 3 PM (hPa)</label>
                <input type="number" step="any" id="Pressure3pm" name="Pressure3pm" placeholder="e.g. 1012.4" required>
            </div>

            <button type="submit" class="btn">Predict Weather</button>
        </form>

        {% if prediction %}
            <div class="result-box {{ result_class }}">
                <h3>{{ prediction }}</h3>
            </div>
        {% endif %}
    </div>
</body>
</html>
