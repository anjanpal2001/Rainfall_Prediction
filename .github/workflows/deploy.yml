name: Deploy Rainfall Prediction API to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Python and Train Model
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Train & Upload Model to S3
        run: |
          pip install -r requirements.txt
          
          S3_BUCKET="rainfall-prediction-bucket-2026"
          if ! aws s3api head-bucket --bucket "$S3_BUCKET" 2>/dev/null; then
            echo "Creating S3 Bucket: $S3_BUCKET"
            aws s3api create-bucket --bucket "$S3_BUCKET" --region ${{ secrets.AWS_REGION }}
          fi

          python models/train_model.py

      - name: Deploy Container to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/app && cd ~/app

            if [ -d ".git" ]; then
              git pull origin main
            else
              git clone https://github.com/<YOUR_GITHUB_USERNAME>/Rainfall_Prediction_Project.git .
            fi

            docker build -t rainfall-api .
            docker stop rainfall-app || true
            docker rm rainfall-app || true

            docker run -d -p 8000:8000 \
              -e S3_BUCKET_NAME="rainfall-prediction-bucket-2026" \
              -e AWS_REGION="${{ secrets.AWS_REGION }}" \
              -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              --name rainfall-app rainfall-api