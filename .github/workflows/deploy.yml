name: CI/CD Pipeline to EC2, Docker & S3

on:
  push:
    branches:
      - main

jobs:
  train-build-deploy:
    runs-on: ubuntu-latest

    steps:
   
      - name: Checkout Code
        uses: actions/checkout@v3

     
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

     
      - name: Install Dependencies & Train Model
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          pip install -r requirements.txt
          python models/train_model.py

     
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

  
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rainfall-app:latest

     
      - name: Deploy Docker Container to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker stop rainfall-container || true
            sudo docker rm rainfall-container || true
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/rainfall-app:latest
            sudo docker run -d \
              --name rainfall-container \
              -p 8000:8000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/rainfall-app:latest
